name: Poll Tibo Reset

on:
  schedule:
    # 每 5 分钟跑一次（GitHub Actions cron 最小粒度就是 5 分钟）
    # 注意：GitHub 对公共仓 schedule 比较准时，私有仓可能有延迟
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 支持手动触发，方便初次测试

permissions:
  contents: write  # 用于回写 src/sent_tweets.json

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run poll
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          CONFIDENCE_THRESHOLD: ${{ secrets.CONFIDENCE_THRESHOLD }}
        run: python src/main.py

      - name: Commit sent_tweets.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sent_tweets.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: update sent_tweets.json [skip ci]"
            git push
          fi
