name: Poll Tibo Reset

on:
  # 暂停自动运行；找到合适服务器后恢复 push/schedule 触发即可。
  workflow_dispatch:  # 保留手动入口，便于迁移完成后验证

permissions:
  contents: write  # 用于回写 src/sent_tweets.json

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run poll
        env:
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          TWITTER_USER_ID: ${{ secrets.TWITTER_USER_ID }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py

      - name: Commit sent_tweets.json
        # commit 失败不应影响整体运行结果（推送已在 Run poll 步完成）
        # 并发运行时 push 可能被拒绝，用 rebase 重试；仍失败则跳过，下次运行会重新处理
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sent_tweets.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: update sent_tweets.json [skip ci]"
          # rebase 远端最新再 push，解决并发冲突
          git pull --rebase origin main || {
            echo "rebase 失败，放弃本次提交，下次运行会重新处理"
            exit 0
          }
          git push || {
            echo "push 失败，放弃本次提交，下次运行会重新处理"
            exit 0
          }
