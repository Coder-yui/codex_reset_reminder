name: Poll Tibo Reset

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/sent_tweets.json'
  schedule:
    # 每 5 分钟跑一次（GitHub Actions cron 最小粒度就是 5 分钟）
    # 注意：GitHub 对公共仓 schedule 比较准时，私有仓可能有延迟
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 支持手动触发，方便初次测试

permissions:
  contents: write  # 用于回写 src/sent_tweets.json

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run poll
        env:
          RSSHUB_URL: ${{ secrets.RSSHUB_URL }}
          TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
          # 默认 https://xcancel.com；如主站不可用，可在 Secret 中换兼容实例
          XCANCEL_URL: ${{ secrets.XCANCEL_URL }}
          # 用户时间线路由漏掉的历史帖：单条补取，成功后由 sent_tweets 去重。
          RECOVERY_TWEET_IDS: '2086188036493344823'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          CONFIDENCE_THRESHOLD: ${{ secrets.CONFIDENCE_THRESHOLD }}
        run: python src/main.py

      - name: Commit sent_tweets.json
        # commit 失败不应影响整体运行结果（推送已在 Run poll 步完成）
        # 并发运行时 push 可能被拒绝，用 rebase 重试；仍失败则跳过，下次运行会重新处理
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/sent_tweets.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: update sent_tweets.json [skip ci]"
          # rebase 远端最新再 push，解决并发冲突
          git pull --rebase origin main || {
            echo "rebase 失败，放弃本次提交，下次运行会重新处理"
            exit 0
          }
          git push || {
            echo "push 失败，放弃本次提交，下次运行会重新处理"
            exit 0
          }
