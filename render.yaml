# Render Blueprint 文件
# 用法：在 Render Dashboard 选 "New → Blueprint" → 选这个仓库 → 自动读 render.yaml
# 或者直接忽略这个文件，手动在 Render Web 界面建服务也行
# 文档：https://render.com/docs/blueprint-spec

services:
  - type: web
    name: rsshub
    env: docker
    # 使用 RSSHub 官方镜像
    image: diygod/rsshub:latest
    plan: free
    region: singapore  # 海外节点，访问 X 不需要梯子
    healthCheckPath: /healthz  # RSSHub 自带健康检查端点
    autoDeploy: false  # 镜像更新不自动重新部署，避免意外
    envVars:
      # 这两个值需要你手动在 Render Dashboard 填（出于安全不在这里明文）
      # 获取方法见 .env.example 里的"获取 X cookie 的方法"
      - key: TWITTER_AUTH_TOKEN
        sync: false  # sync: false = 在 Dashboard 手动填
      - key: TWITTER_CT0
        sync: false
